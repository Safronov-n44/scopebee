<!DOCTYPE html>
<html lang="en-us">
   <head>
      <meta charset="utf-8">
      <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
      <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
      <title>Unity WebGL Player | Product</title>
      <link rel="shortcut icon" href="TemplateData/favicon.ico">
      <link rel="stylesheet" href="TemplateData/style.css">
      <script src="TemplateData/UnityProgress.js"></script>
      <script src="TemplateData/config.js"></script>
   </head>
   <body>
      <main class="game-wrapper">
         <div class="game">
            <div class="webgl-content">
               <div id="unityContainer" class="unityContainer">
                  <canvas id="unityContainerCanvas" class="unityContainerCanvas"></canvas>
               </div>
            </div>
            <script>createProgressBlock()</script>
         </div>
         <script>
               

            const container = document.querySelector("#unityContainer");
            const canvas = document.querySelector("#unityContainerCanvas");
            
      
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) 
            {
             // Mobile device style: fill the whole browser client area with the game canvas:
            
                var meta = document.createElement('meta');
                meta.name = 'viewport';
                meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
                document.getElementsByTagName('head')[0].appendChild(meta);
            
               container.className = "unity-mobile";
               container.style.width = "100%";
               container.style.height = "100%";
               canvas.className = "unity-mobile";
            
            
            }

            var MyGameInstance = null;

            // Сохранение при уходе со страницы — только когда инстанс уже создан
            var saveFromIndex = () => {
               if (MyGameInstance !== null)
                  MyGameInstance.SendMessage('SaveController', 'SaveFromIndex');
            };

            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                          createUnityInstance(canvas, config, unityProgress).then(unityInstance=>
                          {
                              MyGameInstance = unityInstance;
                              hideProgressBar(unityInstance);
                              window.onbeforeunload = saveFromIndex;
                              window.onblur = saveFromIndex;
                          }).catch((message) => {
                              console.error(message);
                              alert(message);
                          });
            };
            script.onerror = () => { console.error("Failed to load " + loaderUrl); };
            document.body.appendChild(script);

            var doFocus = () => {
               container.focus();
               window.focus();
               canvas.focus();
            }
      
            canvas.addEventListener("touchstart", doFocus);
            canvas.addEventListener("pointerdown", doFocus);
            canvas.addEventListener("click", doFocus);
            document.addEventListener("pointerdown", doFocus);
            document.addEventListener('contextmenu', event => event.preventDefault());
      
         </script>
      </main>
   </body>
</html>
