// playable.js — слой рекламных сетей для одностраничного билда (--playable).
//
// Занимает то же место, что cow_platform.js обычного веб-билда: реализует контракт
// globalThis.CowPlatform, который читает C-мост external/sokol/platform_web.c. Поэтому
// новых импортов в wasm нет, а игровой код работает через те же фасады (CoPlatform для
// паузы, CoPlayable для CTA). Упаковщик tools/pack_playable.py вклеивает файл в страницу
// отдельным <script> ДО index.js — как и cow_platform.js в обычном билде.
//
// Ядро площадок (platform/core.js) намеренно НЕ переиспользуется: там загрузка внешнего
// SDK, реклама, игрок и облако — в рекламном креативе всего этого нет, а вес страницы
// считается сетью. Здесь только детект сети, CTA и пауза по видимости.
//
// Сети определяются по API, который они кладут в окно креатива:
//   FbPlayableAd  — Facebook / Meta            CTA: FbPlayableAd.onCTAClick()
//   window.install — Mintegral                 CTA: install(), конец игры: gameEnd()
//   ExitApi       — Google Ads (AdMob/AdSense) CTA: ExitApi.exit()
//   mraid         — общий IAB MRAID 2/3: AppLovin, ironSource, Unity Ads, Vungle, Liftoff
//                                              CTA: mraid.open(<ссылка на стор>)
// Ссылки на сторы подставляет build_web.sh из project.json (build.playable.storeUrl*):
// без них mraid-сети открывать нечего, поэтому сборка предупреждает.
(function () {
  'use strict';

  // Зеркало enum'ов PlatformBridge.bf / core.js — менять только парно.
  var E = { CONNECTED: 100, PAUSE: 102, RESUME: 103 };
  var OP = {
    ID: 0, IS_CONNECTED: 1, CAPS: 2,
    GAME_READY: 10, GAMEPLAY_START: 11, GAMEPLAY_STOP: 12, HAPPY_TIME: 13,
    PLAYABLE_CTA: 70, PLAYABLE_FINISH: 71
  };
  var STR = { LANG: 0, APP_ID: 1, PAYLOAD: 2, COUNTRY: 3, PLATFORM_NAME: 4 };
  var CAPS = { ADS: 0, PLAYER: 1, CLOUD: 2, DEVICE: 3 };
  var PLATFORM_PLAYABLE = 3;      // PlatformId.Playable
  var PAUSE_HIDDEN = 1;           // PauseSource.Hidden
  var PAUSE_SDK = 2;              // PauseSource.Sdk

  // Заменяется упаковщиком на строковые литералы из project.json.
  var STORE = { ios: "", android: "" };

  function log(level, msg) {
    try { (console[level] || console.log)('[CowPlayable] ' + msg); } catch (e) {}
  }

  var P = {
    queue: [],
    cur: null,
    network: 'none',
    device: 0,
    mraidReady: false,
    pendingCta: false,
    pauseSources: {},

    emit: function (kind, code, str) {
      this.queue.push({ k: kind | 0, c: code | 0, s: (str === undefined || str === null) ? null : String(str) });
    },

    // Тип устройства по UA: точного API у сетей нет, а игре важно лишь «телефон или нет»
    // (размер кнопок, ориентация). Планшет отличаем по iPad / Android без "Mobile".
    detectDevice: function () {
      var ua = '';
      try { ua = navigator.userAgent || ''; } catch (e) { return 0; }
      if (/iPad|Tablet|PlayBook|Silk|(Android(?!.*Mobile))/i.test(ua)) { return 3; }
      if (/Mobi|Android|iPhone|iPod|IEMobile|Opera Mini/i.test(ua)) { return 2; }
      return 1;
    },

    detectNetwork: function () {
      // Порядок важен: у Facebook и Mintegral в окне бывает и mraid-заглушка,
      // а их собственный API точнее — по нему сеть и засчитывает клик.
      try { if (typeof FbPlayableAd !== 'undefined' && FbPlayableAd) { return 'facebook'; } } catch (e) {}
      try { if (typeof window.install === 'function') { return 'mintegral'; } } catch (e) {}
      try { if (window.ExitApi && typeof window.ExitApi.exit === 'function') { return 'google'; } } catch (e) {}
      try { if (typeof mraid !== 'undefined' && mraid) { return 'mraid'; } } catch (e) {}
      return 'none';
    },

    storeUrl: function () {
      var ua = '';
      try { ua = navigator.userAgent || ''; } catch (e) {}
      if (/iPhone|iPad|iPod|Mac OS X/i.test(ua) && STORE.ios) { return STORE.ios; }
      if (STORE.android) { return STORE.android; }
      return STORE.ios || '';
    },

    // CTA. Ответ 1 — клик ушёл сети, 0 — открывать нечем (в лог, игра не падает).
    // Про жест: mraid.open / onCTAClick / install / ExitApi.exit вызываются из wasm,
    // то есть вне обработчика клика браузера — этим API это безразлично, в отличие от
    // window.open, который блокировщик попапов режет. Поэтому фолбэк — последний.
    openStore: function () {
      var url = this.storeUrl();
      try {
        switch (this.network) {
          case 'facebook':
            FbPlayableAd.onCTAClick();
            return 1;
          case 'mintegral':
            window.install();
            return 1;
          case 'google':
            window.ExitApi.exit();
            return 1;
          case 'mraid':
            if (!this.mraidReady) {
              // MRAID до 'ready' игнорирует вызовы: запоминаем и открываем по готовности.
              this.pendingCta = true;
              log('info', 'CTA до готовности mraid — открою по событию ready');
              return 1;
            }
            if (url) {
              mraid.open(url);
            } else {
              // Часть сетей (AppLovin, Unity) сама подставляет ссылку клика.
              mraid.open();
            }
            return 1;
        }
        if (url) {
          window.open(url, '_blank');
          return 1;
        }
      } catch (e) {
        log('error', 'CTA не сработал: ' + (e && e.message || e));
        return 0;
      }
      log('warn', 'CTA: сети нет и ссылка на стор не задана (project.json → build.playable.storeUrl*)');
      return 0;
    },

    // Конец игровой сессии в креативе. Отдельные сети хотят знать об этом, чтобы показать
    // свой end-card; остальным это no-op.
    finish: function () {
      try {
        if (this.network === 'mintegral' && typeof window.gameEnd === 'function') {
          window.gameEnd();
          return 1;
        }
      } catch (e) {
        log('error', 'finish не сработал: ' + (e && e.message || e));
      }
      return 0;
    },

    setPaused: function (source, on) {
      on = !!on;
      if (!!this.pauseSources[source] === on) { return; }
      this.pauseSources[source] = on;
      this.emit(on ? E.PAUSE : E.RESUME, source);
    },

    call: function (op, req, arg, s1, s2) {
      switch (op) {
        case OP.ID: return PLATFORM_PLAYABLE;
        case OP.IS_CONNECTED: return 1;
        case OP.CAPS: return arg === CAPS.DEVICE ? this.device : 0;   // рекламы/игрока/облака в креативе нет
        case OP.PLAYABLE_CTA: return this.openStore();
        case OP.PLAYABLE_FINISH: return this.finish();
        // Жизненный цикл площадок креативу не нужен, но фасады его зовут (в том числе
        // GameReady после первого кадра) — молча отвечаем «принято».
        case OP.GAME_READY: case OP.GAMEPLAY_START: case OP.GAMEPLAY_STOP: case OP.HAPPY_TIME: return 1;
      }
      return 0;
    },

    getStr: function (key) {
      switch (key) {
        case STR.PLATFORM_NAME: return this.network;   // 'mraid' | 'facebook' | 'mintegral' | 'google' | 'none'
        case STR.LANG: try { return (navigator.language || '').slice(0, 2).toLowerCase(); } catch (e) { return ''; }
        case STR.APP_ID: case STR.PAYLOAD: case STR.COUNTRY: return '';
      }
      return null;
    },

    boot: function () {
      var self = this;
      this.network = this.detectNetwork();
      this.device = this.detectDevice();
      log('info', 'сеть: ' + this.network + ', устройство: ' + this.device);

      if (this.network === 'mraid') {
        try {
          var onReady = function () {
            self.mraidReady = true;
            try { self.setPaused(PAUSE_SDK, !mraid.isViewable()); } catch (e) {}
            try { mraid.addEventListener('viewableChange', function (viewable) { self.setPaused(PAUSE_SDK, !viewable); }); } catch (e) {}
            if (self.pendingCta) {
              self.pendingCta = false;
              self.openStore();
            }
          };
          if (mraid.getState() === 'loading') {
            mraid.addEventListener('ready', onReady);
          } else {
            onReady();
          }
        } catch (e) {
          log('warn', 'mraid есть, но не отвечает: ' + (e && e.message || e));
        }
      }

      // Вкладка/креатив скрыт — та же пауза, что и у обычного веб-билда.
      try {
        document.addEventListener('visibilitychange', function () {
          self.setPaused(PAUSE_HIDDEN, document.hidden);
        });
      } catch (e) {}

      // Площадка «подключена» сразу: SDK грузить не надо, всё уже в окне.
      this.emit(E.CONNECTED, PLATFORM_PLAYABLE);
    }
  };

  globalThis.CowPlatform = P;
  P.boot();
})();

// Отличие в источнике: там fetch за *.br, здесь данные уже лежат в этой же странице
// base64-строками в тегах <script type="text/plain">, и ни одного сетевого запроса нет.
// Это требование playable-сетей (Google Ads, AppLovin, IronSource, Mintegral): один HTML,
// всё внутри.
//
// Сжатие — Zstd, распаковка — fzstd (101arrowz, MIT), склеенный в эту же страницу
// упаковщиком tools/pack_playable.py. Не Brotli, хотя на хостинге используется он: здесь
// декодер едет внутри страницы и его собственный вес входит в лимит сети. Замер на
// FlappyBird: zstd жмёт данные на ~36 КБ хуже brotli, но декодер fzstd — 8 КБ против
// 151 КБ brotli-декодера, итог −94 КБ на странице. Скорость сравнима (~50 мс на wasm).
(function () {
    var IDS = {
        wasm: "cow-wasm",
        data: "cow-data",
        js: "cow-js"
    };

    function log(text) {
        console.log("[INIT] " + text + " | " + performance.now().toFixed(2) + " ms");
    }

    function isWasm(bytes) {
        return bytes.length >= 4 && bytes[0] === 0x00 && bytes[1] === 0x61 && bytes[2] === 0x73 && bytes[3] === 0x6d;
    }

    // Забирает base64 из тега и СРАЗУ выбрасывает узел: строка втрое больше сжатых
    // данных, а в мобильном WebView рекламной сети памяти мало. Дальше её держит только
    // локальная переменная, и после выхода из функции остаются лишь бинарные байты.
    function takeBytes(id) {
        var node = document.getElementById(id);
        if (node === null) {
            return null;
        }
        var text = node.textContent.trim();
        node.textContent = "";
        node.parentNode.removeChild(node);

        var binary = atob(text);
        var out = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
            out[i] = binary.charCodeAt(i);
        }
        return out;
    }

    function unpack(id, name) {
        var packed = takeBytes(id);
        if (packed === null) {
            throw new Error(name + ": в странице нет блока " + id);
        }
        var t0 = performance.now();
        var result;
        try {
            // Размер результата fzstd берёт из заголовка кадра, поэтому буфер точный
            // и лишних копий нет (zstd CLI пишет content size для файлов).
            result = fzstd.decompress(packed);
        } catch (e) {
            throw new Error(name + ": встроенные данные не распаковались (" + e + ")");
        }
        log(name + ": " + packed.length + " → " + result.length + " Б, распаковано за " + (performance.now() - t0).toFixed(1) + " ms");
        return result;
    }

    function runScript(bytes, name) {
        var script = document.createElement("script");
        script.textContent = new TextDecoder().decode(bytes) + "\n//# sourceURL=" + name;
        document.body.appendChild(script);   // выполняется синхронно при вставке
    }

    try {
        var wasmBytes = unpack(IDS.wasm, "index.wasm");
        var dataBytes = unpack(IDS.data, "index.data");
        var jsBytes = unpack(IDS.js, "index.js");

        if (!isWasm(wasmBytes)) {
            throw new Error("index.wasm: после распаковки это не wasm — страница собрана неверно");
        }

        Module.instantiateWasm = function (imports, onSuccess) {
            WebAssembly.instantiate(wasmBytes, imports).then(function (result) {
                onSuccess(result.instance, result.module);
            }).catch(function (e) {
                console.error("[INIT] instantiate: " + e);
            });
            return {};
        };
        // Буфер должен быть ровно размером пакета — декодер мог вернуть view на больший.
        var dataBuffer = (dataBytes.byteOffset === 0 && dataBytes.length === dataBytes.buffer.byteLength)
            ? dataBytes.buffer
            : dataBytes.slice().buffer;
        Module.getPreloadedPackage = function () {
            return dataBuffer;
        };

        runScript(jsBytes, "index.js");
    } catch (error) {
        console.error("[INIT] Одностраничный билд не загрузился: " + (error && error.message ? error.message : error));
    }
})();
</script></body></html>
